<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compra confirmada — Protocolo Coluna Livre</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#05090c;--text:#e9f1f3;--muted:#93a6ad;--turq:#22e3e8;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
.card{max-width:520px;width:100%;text-align:center;border:1px solid var(--line);border-radius:22px;padding:40px 28px;background:rgba(255,255,255,.04)}
.ok{width:64px;height:64px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;background:rgba(34,227,232,.12);color:var(--turq);font-size:32px;font-weight:800}
h1{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:800;font-size:1.7rem;line-height:1.2;margin-bottom:14px}
p{color:var(--muted);font-size:1rem;margin-bottom:12px}
p b{color:var(--text)}
.help{margin-top:22px;font-size:.88rem}
.help a{color:var(--turq)}
</style>
</head>
<body>
<main class="card">
  <div class="ok">✓</div>
  <h1>Pronto! Seu Protocolo Coluna Livre está garantido.</h1>
  <p>O acesso chega no <b>e-mail que você usou na compra</b>, enviado pela Hotmart, em poucos minutos.</p>
  <p>Não achou? Confira também as pastas de <b>spam</b> e <b>promoções</b>.</p>
  <p class="help">Dúvidas: <a href="mailto:pabloandradeoficial@gmail.com">pabloandradeoficial@gmail.com</a></p>
</main>
</body>
</html>
